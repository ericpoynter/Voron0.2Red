#Raspberry Pi 4 Model B Rev 1.5
#LDO Leviathan V1.3

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_34001B000A51323236393838-if00
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[mcu NHK]
serial: /dev/serial/by-id/usb-Klipper_rp2040_323232323619A855-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 8000
max_z_velocity: 30
max_z_accel: 45
square_corner_velocity: 5.0

[include configs/*.cfg]
[include configs/AFC/*.cfg]
[include KAMP_Settings.cfg]

## Client variable macro for your printer.cfg
[gcode_macro _CLIENT_VARIABLE]
gcode:

