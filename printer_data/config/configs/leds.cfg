# status_off
# status_heating
# status_cooling
# status_printing

[neopixel displayStatus]
pin: display:PA0
chain_count: 1
color_order: GRB
initial_RED: 1
initial_GREEN: 0
initial_BLUE: 0

[neopixel sb_leds]
pin: NHK:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0

[neopixel bed_skirt_leds]
pin: PF10
chain_count: 11
color_order: GRB
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.0
#LEDs
# 1-8 UFO
# 9 Bed
# 10 Right Skirt
# 11 Left Skirt

##########################
# LED Effects Animations #
##########################

##################
## logo effects ##
##################

[led_effect sb_logo_heating]
leds:
    neopixel:sb_leds (3)
autostart: false
frame_rate: 24
layers:
     breathing  3 1 top (1, 0, 0)

[led_effect sb_logo_cooling]
leds:
    neopixel:sb_leds (3)
autostart: false
frame_rate: 24
layers:
     breathing  3 1 top (0, 0, 1)

[led_effect sb_logo_printing]
leds:
    neopixel:sb_leds (3)
autostart: false
frame_rate: 24
layers:
    static         0  0     top        (0.0,  0.0, 1.0)

##################
##  UFO Bed effects ##
##################

[led_effect bed_heating]
autostart: false
frame_rate: 24
leds:
    neopixel:bed_skirt_leds (1-8)
layers:
     static         0  0     top        (1.0,  0.0, 0.0)

[led_effect bed_cooling]
autostart: false
frame_rate: 24
leds:
    neopixel:bed_skirt_leds (1-8)
layers:
      static         0  0     top        (1.0,  0.0, 0.0)

[led_effect bed_printing]
autostart: false
frame_rate: 24
leds:
    neopixel:bed_skirt_leds (1-8)
layers:
      static         0  0     top        (1.0,  0.0, 0.0)


#########################
##  Bed bumper effects ##
#########################

[led_effect bed_bumper_heating]
autostart: false
frame_rate: 24
leds:
    neopixel:bed_skirt_leds (9)
layers:
      breathing  2 1 top (1, 0, 0)

[led_effect bed_bumper_cooling]
autostart: false
frame_rate: 24
leds:
    neopixel:bed_skirt_leds (9)
layers:
      breathing  2 1 top (0, 0, 1)

[led_effect bed_bumper_printing]
autostart: false
frame_rate: 24
leds:
    neopixel:bed_skirt_leds (9)
layers:
      gradient  0.3  1 add (0.3, 0.0, 0.0),(0.3, 0.3, 0.0),(0.3, 0.1, 0.0)

##################
##  Skirt effects ##
##################

[led_effect skirt_heating]
autostart: false
frame_rate: 24
leds:
    neopixel:bed_skirt_leds (10-11)
layers:
      breathing  2 1 top (1, 0, 0)

[led_effect skirt_cooling]
autostart: false
frame_rate: 24
leds:
    neopixel:bed_skirt_leds (10-11)
layers:
      breathing  2 1 top (0, 0, 1)

[led_effect skirt_printing]
autostart: false
frame_rate: 24
leds:
    neopixel:bed_skirt_leds (10-11)
layers:
      gradient  0.3  1 add (0.3, 0.0, 0.0),(0.3, 0.3, 0.0),(0.3, 0.1, 0.0)



#######################
# LED Effects Statics #
#######################

[led_effect set_nozzle_leds]
leds:
    neopixel:sb_leds (1,2)
autostart: false
frame_rate: 24
layers:
    static         0  0     top        (0.0,  0.0, 0.0, 1.0)

[led_effect set_logo_leds]
leds:
    neopixel:sb_leds (1,2)
autostart: false
frame_rate: 24
layers:
    static         0  0     top        (1.0,  1.0, 1.0)

##############
# The Macros #
##############

[gcode_macro set_logo_leds_off]
gcode:
    SET_LED_EFFECT EFFECT=set_logo_leds STOP=1

[gcode_macro set_logo_leds_on]
gcode:
    SET_LED_EFFECT EFFECT=set_logo_leds

[gcode_macro set_nozzle_leds_on]
gcode:
    SET_LED_EFFECT EFFECT=set_nozzle_leds

[gcode_macro set_nozzle_leds_off]
gcode:
    SET_LED_EFFECT EFFECT=set_nozzle_leds STOP=1

[gcode_macro status_off]
gcode:
    STOP_LED_EFFECTS

[gcode_macro status_heating]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_heating
    SET_LED_EFFECT EFFECT=bed_heating
    #SET_LED_EFFECT EFFECT=bed_bumper_heating
    #SET_LED_EFFECT EFFECT=skirt_heating
    set_nozzle_leds_on

[gcode_macro status_cooling]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_cooling
    #SET_LED_EFFECT EFFECT=bed_cooling
    SET_LED_EFFECT EFFECT=bed_bumper_cooling
    #SET_LED_EFFECT EFFECT=skirt_cooling
    set_nozzle_leds_on

[gcode_macro status_printing]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_printing
    #SET_LED_EFFECT EFFECT=bed_printing
    #SET_LED_EFFECT EFFECT=bed_bumper_printing
    SET_LED_EFFECT EFFECT=skirt_printing
    set_nozzle_leds_on


