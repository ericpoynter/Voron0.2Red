[update_manager crowsnest]
type: git_repo
path: ~/crowsnest
origin: https://github.com/mainsail-crew/crowsnest.git
primary_branch: v5
managed_services: crowsnest
system_dependencies: system-dependencies.json
virtualenv: ~/crowsnest-env
requirements: requirements.txt

#[update_manager filter_monitor]
#type: git_repo
#path: ~/klipper-filter_monitor
#origin: https://github.com/blankhaus/klipper-filter_monitor.git
#managed_services: klipper moonraker
#primary_branch: main
#install_script: install.sh

[update_manager kiauh]
type: git_repo
path: ~/kiauh
origin: https://github.com/th33xitus/kiauh.git
is_system_service: False

[update_manager Klipper-Adaptive-Meshing-Purging]
primary_branch: main
managed_services: klipper
origin: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
path: /home/pi/Klipper-Adaptive-Meshing-Purging
channel: dev
type: git_repo

[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main

[update_manager klipper_tmc_autotune]
primary_branch: main
managed_services: klipper
origin: https://github.com/andrewmcgr/klipper_tmc_autotune
path: /home/pi/klipper_tmc_autotune
channel: dev
type: git_repo

[update_manager led_effect]
type: git_repo
path: ~/klipper-led_effect
origin: https://github.com/julianschill/klipper-led_effect.git
is_system_service: False

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: ~/mainsail

[update_manager mainsail-config]
type: git_repo
primary_branch: master
path: ~/mainsail-config
origin: https://github.com/mainsail-crew/mainsail-config.git
managed_services: klipper

[update_manager sonar]
type: git_repo
path: ~/sonar
origin: https://github.com/mainsail-crew/sonar.git
primary_branch: main
managed_services: sonar
system_dependencies: resources/system-dependencies.json

